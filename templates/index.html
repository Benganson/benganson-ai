<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Benganson AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }

        :root {
            --bg: #15121b;
            --panel: #1c1824;
            --panel-2: #221d2b;
            --border: rgba(255,255,255,0.07);
            --text: #f3f0f6;
            --muted: #948d9f;
            --accent-1: #ff9d5c;
            --accent-2: #ff6b6b;
            --gradient: linear-gradient(135deg, var(--accent-1), var(--accent-2));
        }

        body {
            background-color: var(--bg);
            background-image: radial-gradient(circle at 15% 0%, rgba(255,157,92,0.08), transparent 40%);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        #sidebar {
            width: 270px;
            flex-shrink: 0;
            background-color: var(--panel);
            border-right: 1px solid var(--border);
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
        }

        #brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #brand .mark {
            width: 32px;
            height: 32px;
        }

        #brand span {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 17px;
            letter-spacing: 0.2px;
        }

        #new-chat-btn {
            width: 100%;
            padding: 11px 14px;
            border-radius: 10px;
            border: none;
            background: var(--gradient);
            color: #1a1218;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
        }

        .sidebar-section {
            border-top: 1px solid var(--border);
            padding-top: 16px;
        }

        .sidebar-section h3 {
            font-size: 11px;
            font-weight: 600;
            color: var(--muted);
            margin: 0 0 10px 0;
            letter-spacing: 0.3px;
        }

        .chat-history-item {
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 13px;
            color: #cbc5d4;
            cursor: pointer;
        }
        .chat-history-item:hover { background-color: var(--panel-2); }

        #sidebar button, #sidebar input[type="text"] {
            width: 100%;
            margin-bottom: 7px;
        }

        button.tool-btn {
            padding: 9px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background-color: var(--panel-2);
            color: var(--text);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            text-align: left;
        }
        button.tool-btn:hover { border-color: rgba(255,157,92,0.4); }

        input[type="text"], input[type="file"] {
            padding: 9px 11px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background-color: var(--panel-2);
            color: var(--text);
            font-size: 13px;
            font-family: 'Inter', sans-serif;
        }

        #reminders-box .reminder-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--panel-2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 12.5px;
            margin-top: 6px;
        }
        #reminders-box .reminder-item span.txt { color: #f0c9a8; }
        #reminders-box .reminder-item span.del {
            cursor: pointer;
            color: var(--accent-2);
            font-weight: 700;
        }

        #main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 0;
        }

        #chat-box {
            flex: 1;
            width: 100%;
            max-width: 720px;
            overflow-y: auto;
            padding: 36px 24px 10px 24px;
            display: flex;
            flex-direction: column;
        }

        .row {
            display: flex;
            gap: 10px;
            margin-top: 18px;
            align-items: flex-start;
        }
        .row.user { justify-content: flex-end; }

        .avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--gradient);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .avatar svg { width: 18px; height: 18px; }

        .bubble {
            padding: 12px 16px;
            border-radius: 14px;
            max-width: 78%;
            line-height: 1.55;
            font-size: 15px;
            animation: rise 0.25s ease;
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .bubble table {
            border-collapse: collapse;
            margin-top: 8px;
            width: 100%;
            table-layout: fixed;
        }
        .bubble th, .bubble td {
            border: 1px solid rgba(255,255,255,0.15);
            padding: 5px 7px;
            font-size: 12px;
            word-wrap: break-word;
        }

        .user-bubble {
            background: var(--gradient);
            color: #1a1218;
            font-weight: 500;
            border-bottom-right-radius: 4px;
        }

        .ai-bubble {
            background-color: rgba(255,255,255,0.045);
            border: 1px solid var(--border);
            backdrop-filter: blur(6px);
            color: var(--text);
            border-bottom-left-radius: 4px;
        }

        #search-toggle-row {
            width: 100%;
            max-width: 720px;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #search-toggle-row input[type="checkbox"] {
            width: auto;
        }
        #search-toggle-row label {
            font-size: 13px;
            color: var(--muted);
        }

        #input-wrapper {
            width: 100%;
            max-width: 720px;
            padding: 8px 24px 26px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #input-bar {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 4px;
            background-color: var(--panel-2);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 6px 6px 6px 10px;
        }

        #input-bar input {
            flex: 1;
            border: none;
            background: transparent;
            font-size: 15px;
            padding: 10px 0;
            color: var(--text);
        }
        #input-bar input:focus { outline: none; }

        #mic-btn {
            background: transparent;
            border: none;
            color: var(--accent-1);
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        #send-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: none;
            background: var(--gradient);
            color: #1a1218;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        #chat-box::-webkit-scrollbar, #sidebar::-webkit-scrollbar { width: 6px; }
        #chat-box::-webkit-scrollbar-thumb, #sidebar::-webkit-scrollbar-thumb {
            background-color: #372f40;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div id="sidebar">
        <div id="brand">
            <svg class="mark" viewBox="0 0 40 40">
                <defs>
                    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#ff9d5c"/>
                        <stop offset="100%" stop-color="#ff6b6b"/>
                    </linearGradient>
                    <linearGradient id="g2" x1="1" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#ffb98a"/>
                        <stop offset="100%" stop-color="#ff6b6b"/>
                    </linearGradient>
                </defs>
                <circle cx="20" cy="20" r="17" fill="none" stroke="url(#g2)" stroke-width="2" stroke-dasharray="70 40" stroke-linecap="round" transform="rotate(-40 20 20)"/>
                <circle cx="20" cy="20" r="8" fill="url(#g1)"/>
                <circle cx="31" cy="11" r="3" fill="#ff9d5c"/>
            </svg>
            <span>Benganson AI</span>
        </div>

        <button id="new-chat-btn" onclick="newChat()">+ New Chat</button>

        <div class="sidebar-section">
            <h3>Recent</h3>
            <div class="chat-history-item">Current conversation</div>
        </div>

        <div class="sidebar-section">
            <h3>Files</h3>
            <input type="file" id="fileInput" accept=".txt,.pdf,.docx">
            <button class="tool-btn" onclick="uploadFile()">Upload File</button>
            <button class="tool-btn" onclick="quizMe()">Quiz Me</button>
            <button class="tool-btn" onclick="clearFiles()">New File</button>
        </div>

        <div class="sidebar-section">
            <h3>Reminders</h3>
            <input id="reminderInput" type="text" placeholder="Add a reminder...">
            <button class="tool-btn" onclick="addReminder()">Add Reminder</button>
            <div id="reminders-box"></div>
        </div>
    </div>

    <div id="main">
        <div id="chat-box"></div>
        <div id="input-wrapper">
            <div id="search-toggle-row">
                <input type="checkbox" id="webSearchToggle">
                <label for="webSearchToggle">Search the web for this</label>
            </div>
            <div id="search-toggle-row">
                <input type="checkbox" id="speakToggle">
                <label for="speakToggle">Speak replies aloud</label>
            </div>
            <div id="input-bar">
                <button id="mic-btn" onclick="startListening()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="9" y="2" width="6" height="12" rx="3"/>
                        <path d="M5 10a7 7 0 0 0 14 0"/>
                        <line x1="12" y1="17" x2="12" y2="21"/>
                        <line x1="8" y1="21" x2="16" y2="21"/>
                    </svg>
                </button>
                <input id="message" type="text" placeholder="Message Benganson AI..." onkeypress="if(event.key === 'Enter') sendMessage()">
                <button id="send-btn" onclick="sendMessage()">➤</button>
            </div>
        </div>
    </div>

    <script>
        function formatText(text) {
            let formatted = text;

            formatted = formatted.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");
            formatted = formatted.replace(/(?<!\*)\*(?!\*)(.*?)(?<!\*)\*(?!\*)/g, "<em>$1</em>");
            formatted = formatted.replace(/^### (.*)$/gm, "<h3>$1</h3>");
            formatted = formatted.replace(/^## (.*)$/gm, "<h2>$1</h2>");

            const lines = formatted.split("\n");
            let output = [];
            let i = 0;

            while (i < lines.length) {
                const line = lines[i];
                const isTableRow = line.trim().startsWith("|");
                const nextLine = lines[i + 1] || "";
                const isSeparator = /^\|?[\s:-]+\|[\s:|-]+$/.test(nextLine.trim());

                if (isTableRow && isSeparator) {
                    let tableLines = [line];
                    i += 2;
                    while (i < lines.length && lines[i].trim().startsWith("|")) {
                        tableLines.push(lines[i]);
                        i++;
                    }

                    const rows = tableLines.map(l =>
                        l.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim())
                    );

                    let table = "<table>";
                    rows.forEach((row, idx) => {
                        table += "<tr>";
                        row.forEach(cell => {
                            table += idx === 0 ? `<th>${cell}</th>` : `<td>${cell}</td>`;
                        });
                        table += "</tr>";
                    });
                    table += "</table>";

                    output.push(table);
                } else {
                    output.push(line);
                    i++;
                }
            }

            formatted = output.join("\n").replace(/\n/g, "<br>");
            return formatted;
        }

        function addBubble(role, text) {
            const chatBox = document.getElementById("chat-box");
            const row = document.createElement("div");
            row.className = "row " + (role === "user" ? "user" : "ai");

            if (role !== "user") {
                const avatar = document.createElement("div");
                avatar.className = "avatar";
                avatar.innerHTML = '<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" fill="none" stroke="#1a1218" stroke-width="2.5" stroke-dasharray="70 40" stroke-linecap="round" transform="rotate(-40 20 20)"/><circle cx="20" cy="20" r="8" fill="#1a1218"/></svg>';
                row.appendChild(avatar);
            }

            const bubble = document.createElement("div");
            bubble.className = "bubble " + (role === "user" ? "user-bubble" : "ai-bubble");
            bubble.innerHTML = formatText(text);
            row.appendChild(bubble);

            chatBox.appendChild(row);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function speak(text) {
            const speakToggle = document.getElementById("speakToggle");
            if (!speakToggle.checked) return;

            const cleanText = text.replace(/[*#_`]/g, "");
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.rate = 1;
            speechSynthesis.speak(utterance);
        }

        async function loadHistory() {
            const response = await fetch("/history");
            const data = await response.json();

            for (const msg of data.history) {
                if (msg.role === "user" || msg.role === "assistant") {
                    addBubble(msg.role === "user" ? "user" : "ai", msg.content);
                }
            }
        }

        async function newChat() {
            await fetch("/reset");
            document.getElementById("chat-box").innerHTML = "";
        }

        async function uploadFile() {
            const fileInput = document.getElementById("fileInput");
            const file = fileInput.files[0];

            if (!file) {
                alert("Please choose a file first.");
                return;
            }

            const formData = new FormData();
            formData.append("file", file);

            const response = await fetch("/upload", {
                method: "POST",
                body: formData
            });

            const data = await response.json();
            alert(data.status);
        }

        async function quizMe() {
            addBubble("user", "Quiz me on the uploaded file.");

            const response = await fetch(
                "/chat?message=" + encodeURIComponent("Based on the file I uploaded, create a short 5-question quiz to test my understanding of it. Ask one question at a time, and wait for my answer before giving the next question.")
            );

            const data = await response.json();
            addBubble("ai", data.reply);
            speak(data.reply);
        }

        async function clearFiles() {
            const response = await fetch("/clear-files");
            const data = await response.json();
            alert(data.status);
        }

        async function addReminder() {
            const reminderInput = document.getElementById("reminderInput");
            const text = reminderInput.value;

            if (text.trim() === "") {
                return;
            }

            await fetch("/add-reminder?text=" + encodeURIComponent(text), {
                method: "POST"
            });

            reminderInput.value = "";
            loadReminders();
        }

        async function loadReminders() {
            const response = await fetch("/reminders");
            const data = await response.json();

            const box = document.getElementById("reminders-box");
            box.innerHTML = "";

            data.reminders.forEach((r, index) => {
                const item = document.createElement("div");
                item.className = "reminder-item";

                const text = document.createElement("span");
                text.className = "txt";
                text.textContent = "📌 " + r.text;

                const deleteBtn = document.createElement("span");
                deleteBtn.textContent = "✕";
                deleteBtn.className = "del";
                deleteBtn.onclick = async () => {
                    await fetch("/delete-reminder?index=" + index);
                    loadReminders();
                };

                item.appendChild(text);
                item.appendChild(deleteBtn);
                box.appendChild(item);
            });
        }

        function startListening() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

            if (!SpeechRecognition) {
                alert("Sorry, your browser doesn't support voice input. Try Chrome.");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = "en-US";
            recognition.interimResults = false;

            const micBtn = document.getElementById("mic-btn");
            micBtn.style.color = "#ff3b3b";

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                document.getElementById("message").value = transcript;
                micBtn.style.color = "var(--accent-1)";
            };

            recognition.onerror = () => {
                micBtn.style.color = "var(--accent-1)";
            };

            recognition.onend = () => {
                micBtn.style.color = "var(--accent-1)";
            };

            recognition.start();
        }

        async function sendMessage() {
            const messageInput = document.getElementById("message");
            const message = messageInput.value;
            const useWebSearch = document.getElementById("webSearchToggle").checked;

            if (message.trim() === "") {
                return;
            }

            addBubble("user", message);
            messageInput.value = "";

            const endpoint = useWebSearch
                ? "/web-search?query=" + encodeURIComponent(message)
                : "/chat?message=" + encodeURIComponent(message);

            const response = await fetch(endpoint);
            const data = await response.json();
            addBubble("ai", data.reply);
            speak(data.reply);
        }

        loadHistory();
        loadReminders();
    </script>
</body>
</html>
